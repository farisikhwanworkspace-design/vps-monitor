name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/zahra/vpsmonitor
          
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="VPS Monitor"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          
          cat > app/src/main/java/com/zahra/vpsmonitor/MainActivity.java << 'JAVA'
          package com.zahra.vpsmonitor;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = new WebView(this);
                  setContentView(w);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("https://farisikhwanworkspace-design.github.io/vps-monitor/");
              }
          }
          JAVA
      
      - name: Build APK
        run: |
          # Create root build.gradle
          cat > build.gradle << 'ROOTGRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          ROOTGRADLE
          
          # Create app/build.gradle
          cat > app/build.gradle << 'APPGRADLE'
          apply plugin: 'com.android.application'
          
          android {
              namespace 'com.zahra.vpsmonitor'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.zahra.vpsmonitor"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          APPGRADLE
          
          # Create settings.gradle
          cat > settings.gradle << 'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VPSMonitor"
          include ':app'
          SETTINGS
          
          # Setup local properties with SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Build
          gradle assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vps-monitor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
