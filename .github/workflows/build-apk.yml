name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      
      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/zahra/vpsmonitor
          
          cat > app/src/main/AndroidManifest.xml << 'EOFMANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="VPS Monitor"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOFMANIFEST
          
          cat > app/src/main/java/com/zahra/vpsmonitor/MainActivity.java << 'EOFJAVA'
          package com.zahra.vpsmonitor;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = new WebView(this);
                  setContentView(w);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.setWebViewClient(new WebViewClient());
                  w.loadUrl("https://farisikhwanworkspace-design.github.io/vps-monitor/");
              }
          }
          EOFJAVA
          
          cat > app/build.gradle << 'EOFGRADLE'
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              defaultConfig {
                  applicationId "com.zahra.vpsmonitor"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOFGRADLE
          
          echo "include ':app'" > settings.gradle
      
      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle assembleDebug || ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vps-monitor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
