<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VPS Monitor Zahra</title>
    <link rel="manifest" href="/vps-monitor/manifest.json">
    <link rel="icon" type="image/png" href="/vps-monitor/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 400px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header .time { color: #888; font-size: 14px; }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 12px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .stat-label { color: #aaa; }
        .stat-value { font-weight: 600; }
        .bar-container {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        .bar-cpu { background: linear-gradient(90deg, #4ade80, #22c55e); }
        .bar-ram { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
        .bar-disk { background: linear-gradient(90deg, #f472b6, #ec4899); }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .service-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }
        .status-dot.off { background: #ef4444; }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 16px;
        }
        .btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; opacity: 0.5; }
        .btn-success { background: #22c55e; color: #fff; opacity: 0.5; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .info-box {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-size: 13px;
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ VPS Monitor</h1>
            <div class="time" id="time">Loading...</div>
        </div>
        
        <div class="card">
            <div class="card-title">⚡ CPU</div>
            <div class="stat-row">
                <span class="stat-label">Usage</span>
                <span class="stat-value" id="cpu-pct">--%</span>
            </div>
            <div class="bar-container"><div class="bar-fill bar-cpu" id="cpu-bar" style="width:0%"></div></div>
        </div>
        
        <div class="card">
            <div class="card-title">🧠 RAM</div>
            <div class="stat-row">
                <span class="stat-label">Used</span>
                <span class="stat-value" id="ram-used">-- / --</span>
            </div>
            <div class="bar-container"><div class="bar-fill bar-ram" id="ram-bar" style="width:0%"></div></div>
        </div>
        
        <div class="card">
            <div class="card-title">💾 Disk</div>
            <div class="stat-row">
                <span class="stat-label">Used</span>
                <span class="stat-value" id="disk-used">-- / --</span>
            </div>
            <div class="bar-container"><div class="bar-fill bar-disk" id="disk-bar" style="width:0%"></div></div>
        </div>
        
        <div class="card">
            <div class="card-title">🔌 Services</div>
            <div class="service-grid" id="services">
                <div class="service-item"><div class="status-dot"></div><span>Loading...</span></div>
            </div>
        </div>
        
        <div class="btn-grid">
            <button class="btn btn-primary" onclick="refreshData()">🔄 Refresh</button>
            <button class="btn btn-secondary" onclick="showInfo()">ℹ️ Info</button>
        </div>
        
        <div class="info-box" id="info" style="display:none">
            <b>📌 Cara Gunakan:</b><br><br>
            1. Buka link Telegram bot untuk data live<br>
            2. App ini untuk quick reference<br>
            3. Tekan Refresh untuk update manual<br><br>
            <b>🔗 Telegram Bot:</b><br>
            @vppssmobitorrsystembot
        </div>
    </div>
    
    <script>
        // Default data (from last known state)
        const defaultData = {
            cpu: { pct: 5.2, cores: 2 },
            ram: { used: 1500000000, total: 4294967296, pct: 35 },
            disk: { used: 214748364800, total: 872415232000, pct: 25 },
            services: {
                "9Router": true,
                "Proxy": true,
                "OpenViking": true,
                "Dashboard": true,
                "Tailscale": true,
                "Cloudflared": true
            }
        };
        
        function fmtBytes(bytes) {
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
            return bytes.toFixed(1) + units[i];
        }
        
        function updateUI(data) {
            document.getElementById('time').textContent = 'Last updated: ' + new Date().toLocaleString('ms-MY');
            
            document.getElementById('cpu-pct').textContent = data.cpu.pct.toFixed(1) + '%';
            document.getElementById('cpu-bar').style.width = data.cpu.pct + '%';
            
            document.getElementById('ram-used').textContent = fmtBytes(data.ram.used) + ' / ' + fmtBytes(data.ram.total);
            document.getElementById('ram-bar').style.width = data.ram.pct + '%';
            
            document.getElementById('disk-used').textContent = fmtBytes(data.disk.used) + ' / ' + fmtBytes(data.disk.total);
            document.getElementById('disk-bar').style.width = data.disk.pct + '%';
            
            const svcHtml = Object.entries(data.services).map(([name, ok]) => 
                `<div class="service-item"><div class="status-dot ${ok ? '' : 'off'}"></div><span>${name}</span></div>`
            ).join('');
            document.getElementById('services').innerHTML = svcHtml;
        }
        
        function refreshData() {
            // In real deployment, this would fetch from API
            // For now, use default data
            updateUI(defaultData);
        }
        
        function showInfo() {
            const info = document.getElementById('info');
            info.style.display = info.style.display === 'none' ? 'block' : 'none';
        }
        
        // Initialize
        refreshData();
        
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
